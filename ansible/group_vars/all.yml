---
app_dir: /home/admin-gsp
compose_project_name: group-sessions-platform
compose_network_name: group-sessions-platform
deploy_user: "{{ ansible_user | default('ubuntu') }}"

docker_image_name: >-
  {{
    lookup('ansible.builtin.env', 'DOCKER_IMAGE_NAME')
    | default('xludw1ng/studiom-backend', true)
  }}
docker_image_tag: >-
  {{
    lookup('ansible.builtin.env', 'DOCKER_IMAGE_TAG')
    | default(lookup('ansible.builtin.env', 'CI_COMMIT_TAG'), true)
    | default(lookup('ansible.builtin.env', 'GITHUB_REF_NAME'), true)
    | default('latest', true)
  }}
docker_image_ref: "{{ docker_image_name }}:{{ docker_image_tag }}"
docker_context_dir: "{{ playbook_dir }}/../.."
dockerfile_path: "{{ playbook_dir }}/../../src/Dockerfile"
ansible_templates_dir: "{{ playbook_dir | dirname }}/templates"
docker_user: "{{ lookup('ansible.builtin.env', 'DOCKER_USER') | default('', true) }}"
docker_token: "{{ lookup('ansible.builtin.env', 'DOCKER_TOKEN') | default('', true) }}"

app_env:
  DB__DRIVER: >-
    {{
      lookup('ansible.builtin.env', 'DB__DRIVER')
      | default('postgresql+asyncpg', true)
    }}
  DB__HOST: postgres
  DB__PORT: "5432"
  DB__USER: "{{ lookup('ansible.builtin.env', 'DB__USER') | default('postgres', true) }}"
  DB__PASSWORD: "{{ lookup('ansible.builtin.env', 'DB__PASSWORD') | default('', true) }}"
  DB__NAME: "{{ lookup('ansible.builtin.env', 'DB__NAME') | default('db', true) }}"
  AUTH__SECRET: "{{ lookup('ansible.builtin.env', 'AUTH__SECRET') | default('', true) }}"
  AUTH__TOKEN_ALGORITHM: >-
    {{
      lookup('ansible.builtin.env', 'AUTH__TOKEN_ALGORITHM')
      | default('HS256', true)
    }}
  AUTH__ACCESS_TOKEN_LIFETIME_SECONDS: >-
    {{
      lookup('ansible.builtin.env', 'AUTH__ACCESS_TOKEN_LIFETIME_SECONDS')
      | default('300', true)
    }}
  AUTH__REFRESH_TOKEN_LIFETIME_SECONDS: >-
    {{
      lookup('ansible.builtin.env', 'AUTH__REFRESH_TOKEN_LIFETIME_SECONDS')
      | default('600', true)
    }}
  AUTH__COOKIE_SECURE: >-
    {{
      lookup('ansible.builtin.env', 'AUTH__COOKIE_SECURE')
      | default('true', true)
    }}
  RBAC__ADMIN_EMAIL: >-
    {{
      lookup('ansible.builtin.env', 'RBAC__ADMIN_EMAIL')
      | default('admin@example.com', true)
    }}
  RBAC__ADMIN_PASSWORD: >-
    {{
      lookup('ansible.builtin.env', 'RBAC__ADMIN_PASSWORD')
      | default('', true)
    }}
  RBAC__ADMIN_ROLE: >-
    {{
      lookup('ansible.builtin.env', 'RBAC__ADMIN_ROLE')
      | default('admin', true)
    }}
  RBAC__PUBLIC_ROLE: >-
    {{
      lookup('ansible.builtin.env', 'RBAC__PUBLIC_ROLE')
      | default('public', true)
    }}
  SOCKET__PATH: >-
    {{
      lookup('ansible.builtin.env', 'SOCKET__PATH')
      | default('socket.io', true)
    }}
  SOCKET__CORS_ALLOWED_ORIGINS: >-
    {{
      lookup('ansible.builtin.env', 'SOCKET__CORS_ALLOWED_ORIGINS')
      | default('*', true)
    }}
  COMMON__SCHEME: >-
    {{
      lookup('ansible.builtin.env', 'COMMON__SCHEME')
      | default('https', true)
    }}
  COMMON__HOST: >-
    {{
      lookup('ansible.builtin.env', 'COMMON__HOST')
      | default('localhost', true)
    }}
  COMMON__BACKEND_PORT: >-
    {{
      lookup('ansible.builtin.env', 'COMMON__BACKEND_PORT')
      | default('443', true)
    }}
  COMMON__FRONTEND_PORT: >-
    {{
      lookup('ansible.builtin.env', 'COMMON__FRONTEND_PORT')
      | default('443', true)
    }}
  RATE_LIMIT__DEFAULT: >-
    {{
      lookup('ansible.builtin.env', 'RATE_LIMIT__DEFAULT')
      | default('100/minute', true)
    }}
  RATE_LIMIT__AUTH: >-
    {{
      lookup('ansible.builtin.env', 'RATE_LIMIT__AUTH')
      | default('10/minute', true)
    }}
  EMAIL__USERNAME: >-
    {{
      lookup('ansible.builtin.env', 'EMAIL__USERNAME')
      | default('example@gmail.com', true)
    }}
  EMAIL__PASSWORD: "{{ lookup('ansible.builtin.env', 'EMAIL__PASSWORD') | default('', true) }}"
  EMAIL__SERVER: >-
    {{
      lookup('ansible.builtin.env', 'EMAIL__SERVER')
      | default('smtp.gmail.com', true)
    }}
  EMAIL__PORT: "{{ lookup('ansible.builtin.env', 'EMAIL__PORT') | default('587', true) }}"
  EMAIL__FROM_EMAIL: >-
    {{
      lookup('ansible.builtin.env', 'EMAIL__FROM_EMAIL')
      | default('example@gmail.com', true)
    }}
  EMAIL__FROM_NAME: >-
    {{
      lookup('ansible.builtin.env', 'EMAIL__FROM_NAME')
      | default('Example', true)
    }}
  EMAIL__STARTTLS: "{{ lookup('ansible.builtin.env', 'EMAIL__STARTTLS') | default('true', true) }}"
  EMAIL__SSL_TLS: "{{ lookup('ansible.builtin.env', 'EMAIL__SSL_TLS') | default('false', true) }}"
  EMAIL__USE_CREDENTIALS: >-
    {{
      lookup('ansible.builtin.env', 'EMAIL__USE_CREDENTIALS')
      | default('true', true)
    }}
  EMAIL__VALIDATE_CERTS: >-
    {{
      lookup('ansible.builtin.env', 'EMAIL__VALIDATE_CERTS')
      | default('true', true)
    }}
  EMAIL__NOTIFICATION_LIFETIME_SECONDS: >-
    {{
      lookup('ansible.builtin.env', 'EMAIL__NOTIFICATION_LIFETIME_SECONDS')
      | default('3600', true)
    }}
  EMAIL__TEMPLATE_FOLDER: src/app/templates

required_app_env_keys:
  - DB__USER
  - DB__PASSWORD
  - DB__NAME
  - AUTH__SECRET
  - RBAC__ADMIN_EMAIL
  - RBAC__ADMIN_PASSWORD
