- name: Build image playbook
  hosts: gsp
  become: true
  vars:
    app_dir: "/home/{{ ansible_user }}"
    image_tag: "{{ lookup('env', 'CI_COMMIT_TAG') }}"
    image_build_dir: "{{ app_dir }}/build/src"
    docker_user: "{{ lookup('env', 'DOCKER_USER') }}"
    docker_token: "{{ lookup('env', 'DOCKER_TOKEN') }}"
    docker_image_name: "{{ lookup('env', 'DOCKER_IMAGE_NAME') }}"
    image_name: "{{ docker_user }}/{{ docker_image_name }}"
  tasks:
    - name: Remove previous temporary source code
      ansible.builtin.file:
        path: "{{ image_build_dir }}"
        state: absent

    - name: Ensure build directory exists
      ansible.builtin.file:
        path: "{{ image_build_dir | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy source code
      ansible.posix.synchronize:
        src: ../../src/
        dest: "{{ image_build_dir }}/"
        delete: true
        rsync_opts:
          - "--exclude=.env"

    - name: Build image
      community.docker.docker_image_build:
        name: "{{ image_name }}"
        tag: "{{ image_tag }}"
        path: "{{ image_build_dir }}"

    - name: Remove temporary build folder
      ansible.builtin.file:
        path: "{{ image_build_dir | dirname }}"
        state: absent

    - name: Login to registry
      community.docker.docker_login:
        username: "{{ docker_user }}"
        password: "{{ docker_token }}"
        reauthorize: true

    - name: Push image
      community.docker.docker_image_push:
        name: "{{ image_name }}"
        tag: "{{ image_tag }}"
