name: Release app workflow
on:
  push:
    branches:
      - main
      - ci-cd-branch

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      new_release_version: ${{ steps.semantic_release.outputs.new_release_version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Run semantic-release
        id: semantic_release
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.12'

      - name: Install Ansible
        run: pipx install --include-deps Ansible

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Setup SSH
        shell : bash
        run: |
          eval  `ssh-agent -s`
          mkdir -p ~/.ssh/
          touch ~/.ssh/host-group-session-platform
          echo -e "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d | tr -d '\r' > ~/.ssh/host-group-session-platform
          chmod 700 ~/.ssh/host-group-session-platform
          echo -e "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Create inventory
        run: |
          cat > ansible/inventory.ini << EOF
          [gsp]
          ${{ secrets.VM_HOST }}
          EOF
      
      - name: Run playbook
        run: |
          cd ansible
          ansible-playbook \
            -i inventory.ini \
            -u ${{ secrets.VM_USER }} \
            --private-key ~/.ssh/host-group-session-platform \
            playbooks/test-playbook.yaml
        env:
          ANSIBLE_FORCE_COLOR: "true"
          ANSIBLE_HOST_KEY_CHECKING: "false"
          DOCKER_USER: ${{ vars.DOCKER_USER }}
          DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
          CI_COMMIT_TAG: ${{ needs.release.outputs.new_release_version }}-gsp-tag
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

      - name: Create .env file
        run: echo "${{ secrets.ENV }}" > ~/.env

      - name: Update a compose
        run: |
          cd ansible
          ansible-playbook \
            -i inventory.ini \
            -u ${{ secrets.VM_USER }} \
            --private-key ~/.ssh/host-group-session-platform \
            playbooks/build-image-playbook.yaml
        env:
          ANSIBLE_FORCE_COLOR: "true"
          ANSIBLE_HOST_KEY_CHECKING: "false"
          ENV: ~/.env
          DOCKER_IMAGE_WITH_TAG: ${{ vars.DOCKER_USER }}
