x-back-image: &back-image xludw1ng/studiom-backend:latest

x-back-env: &back-env
  env_file:
    - .env

x-back-common: &back-common
  <<: *back-env
  image: *back-image
  volumes:
    - ./src:/app/src
    - ./migrations:/app/migrations
    - ./alembic.ini:/app/alembic.ini
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:18
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB__DB_USER}
      POSTGRES_PASSWORD: ${DB__DB_PASSWORD}
      POSTGRES_DB: ${DB__DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB__DB_USER} -d ${DB__DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrations:
    <<: *back-common
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  rbac:
    <<: *back-common
    command: python -m src.app.init
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: 'no'

  api:
    <<: *back-common
    command: >
        gunicorn src.app.main:app
        --worker-class uvicorn.workers.UvicornWorker
        --bind 0.0.0.0:8000
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      rbac:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  reverse-proxy:
    image: nginx:latest
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/var/www/html:ro
    restart: unless-stopped

volumes:
  postgres_data: