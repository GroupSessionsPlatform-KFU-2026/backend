x-back-image: &back-image xludw1ng/studiom-backend:latest
x-front-image: &front-image nginx:latest

x-back-env: &back-env
  env_file:
    - .env
  environment:
    DB__HOST: postgres
    DB__PORT: "5432"

x-back-common: &back-common
  <<: *back-env
  image: *back-image

services:
  postgres:
    image: postgres:18
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB__USER}
      POSTGRES_PASSWORD: ${DB__PASSWORD}
      POSTGRES_DB: ${DB__NAME}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB__USER} -d ${DB__NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrations:
    <<: *back-common
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  rbac:
    <<: *back-common
    command: python -m src.app.init
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: on-failure

  api:
    <<: *back-common
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      rbac:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  reverse-proxy:
    image: *front-image
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/var/www/html:ro
    restart: unless-stopped

volumes:
  postgres_data:
